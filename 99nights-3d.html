<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Nights - 3D Survival Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #d4af37;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: calc(100% - 60px);
            display: block;
            touch-action: none;
        }

        #ui-panel {
            height: 60px;
            background: linear-gradient(to bottom, rgba(42,42,42,0.9), rgba(26,26,26,0.9));
            border-top: 1px solid #d4af37;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #d4af37;
        }

        .stat-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-bar {
            width: 80px;
            height: 10px;
            background-color: #333;
            border: 1px solid #666;
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ff8844);
            transition: width 0.3s ease;
        }

        #hunger-bar { background: linear-gradient(to right, #8844ff, #ff8844) !important; }
        #fire-bar { background: linear-gradient(to right, #ffaa00, #ff4400) !important; }

        .stat-value {
            font-size: 9px;
            color: #aaa;
        }

        .controls {
            font-size: 9px;
            color: #888;
            text-align: right;
        }

        .controls p {
            margin: 2px 0;
            line-height: 1.2;
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #d4af37;
            font-size: 48px;
            font-weight: bold;
        }

        #gameOverScreen h1 {
            color: #FF4444;
            margin-bottom: 20px;
        }

        #gameOverScreen p {
            font-size: 32px;
            margin-bottom: 20px;
        }

        #gameOverScreen button {
            padding: 15px 40px;
            font-size: 24px;
            background-color: #d4af37;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #gameOverScreen button:hover {
            background-color: #ffcc55;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4af37;
            font-size: 24px;
            text-align: center;
            z-index: 999;
        }

        .day-info {
            text-align: center;
            font-size: 12px;
        }

        .day-info div:first-child {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading">Loading 3D Game...</div>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-panel">
        <div class="stat-section">
            <div class="stat">
                <div class="stat-label">❤️ HP</div>
                <div class="stat-bar">
                    <div id="health-bar" class="bar-fill" style="width: 100%"></div>
                </div>
                <div id="health-text" class="stat-value">100/100</div>
            </div>
            <div class="stat">
                <div class="stat-label">🍖 Hunger</div>
                <div class="stat-bar">
                    <div id="hunger-bar" class="bar-fill" style="width: 80%"></div>
                </div>
                <div id="hunger-text" class="stat-value">80/100</div>
            </div>
            <div class="stat">
                <div class="stat-label">🔥 Fire</div>
                <div class="stat-bar">
                    <div id="fire-bar" class="bar-fill" style="width: 100%"></div>
                </div>
                <div id="fire-text" class="stat-value">20/20</div>
            </div>
            <div class="stat">
                <div class="stat-label">🪵 Wood</div>
                <div id="wood-count" style="font-size: 14px; font-weight: bold;">0</div>
            </div>
        </div>
        <div class="day-info">
            <div id="day-display">Day 1</div>
            <div id="time-display" style="font-size: 10px; color: #888;">Day 00:00</div>
        </div>
        <div class="controls">
            <p><strong>WASD</strong> Move | <strong>Click</strong> Attack | <strong>E</strong> Chop</p>
            <p><strong>F</strong> Fire | <strong>B</strong> Build | <strong>Mouse</strong> Look</p>
        </div>
    </div>
    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p id="survivalText">You survived 5 days</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        let scene, camera, playerMesh, ground;
        let game = {
            day: 1,
            cycleTime: 0,
            maxCycleTime: 1200,
            isNight: false,
            gameOver: false,
            modelsLoaded: false,
            
            player: {
                mesh: null,
                health: 100,
                maxHealth: 100,
                hunger: 80,
                maxHunger: 100,
                speed: 0.2,
            },
            
            resources: {
                wood: 0,
                fireLevel: 20,
                maxFireLevel: 20
            },
            
            camp: {
                position: new BABYLON.Vector3(0, 0, 0),
                radius: 30,
                walls: 0,
                maxWalls: 20,
                fireLight: null
            },
            
            enemies: [],
            trees: [],
            projectiles: [],
            keys: {},
            spawnCounter: 0
        };

        async function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.collisionsEnabled = true;
            scene.gravity = new BABYLON.Vector3(0, -0.15, 0);

            // Sky blue background
            scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92);

            const light = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.9;
            light.specular = new BABYLON.Color3(1, 1, 1);

            const sunLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            sunLight.intensity = 0.7;
            sunLight.range = 300;

            camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 1.7, 0));
            camera.attachControl(canvas, true);
            camera.speed = 0;
            camera.angularSensibility = 1000;
            camera.inertia = 0.7;

            // Ground
            ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 300, height: 300}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuse = new BABYLON.Color3(0.2, 0.5, 0.15);
            groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            ground.material = groundMat;
            ground.checkCollisions = true;

            // Player mesh
            const playerBody = BABYLON.MeshBuilder.CreateCylinder("playerBody", {diameter: 0.8, height: 1.8, tessellation: 16}, scene);
            playerBody.position = new BABYLON.Vector3(0, 0.9, 0);
            
            const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
            playerMat.diffuse = new BABYLON.Color3(0.8, 0.7, 0.4);
            playerMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            playerBody.material = playerMat;
            playerBody.checkCollisions = true;

            const playerHead = BABYLON.MeshBuilder.CreateSphere("playerHead", {diameter: 0.6, segments: 16}, scene);
            playerHead.position = new BABYLON.Vector3(0, 1.6, 0);
            
            const headMat = new BABYLON.StandardMaterial("headMat", scene);
            headMat.diffuse = new BABYLON.Color3(0.9, 0.8, 0.6);
            playerHead.material = headMat;

            game.player.mesh = playerBody;

            // Campfire
            const fireMesh = BABYLON.MeshBuilder.CreateSphere("campfire", {diameter: 2, segments: 16}, scene);
            fireMesh.position = game.camp.position;
            
            const fireMat = new BABYLON.StandardMaterial("fireMat", scene);
            fireMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0);
            fireMat.diffuse = new BABYLON.Color3(1, 0.5, 0);
            fireMesh.material = fireMat;

            const fireLight = new BABYLON.PointLight("fireLight", game.camp.position, scene);
            fireLight.intensity = 1.2;
            fireLight.range = 100;
            fireLight.diffuse = new BABYLON.Color3(1, 0.7, 0.3);
            game.camp.fireLight = fireLight;

            setupInput();
            game.modelsLoaded = true;
            document.getElementById('loading').style.display = 'none';

            return scene;
        }

        function createTree(scene) {
            const posX = (Math.random() - 0.5) * 250;
            const posZ = (Math.random() - 0.5) * 250;
            
            const dist = Math.sqrt(posX * posX + posZ * posZ);
            if (dist < 40) return;

            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {diameter: 1.2, height: 8, tessellation: 12}, scene);
            trunk.position = new BABYLON.Vector3(posX, 4, posZ);
            
            const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
            trunkMat.diffuse = new BABYLON.Color3(0.5, 0.3, 0.1);
            trunkMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            trunk.material = trunkMat;
            trunk.checkCollisions = true;

            const foliage = BABYLON.MeshBuilder.CreateSphere("foliage", {diameter: 8, segments: 16}, scene);
            foliage.position = new BABYLON.Vector3(posX, 9.5, posZ);
            
            const foliageMat = new BABYLON.StandardMaterial("foliageMat", scene);
            foliageMat.diffuse = new BABYLON.Color3(0.15, 0.65, 0.15);
            foliageMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            foliage.material = foliageMat;

            game.trees.push({
                trunk: trunk,
                foliage: foliage,
                position: new BABYLON.Vector3(posX, 0, posZ),
                wood: 3
            });
        }

        function setupInput() {
            window.addEventListener('keydown', (e) => {
                game.keys[e.key.toLowerCase()] = true;
                
                if (e.key.toLowerCase() === 'e') interactWithTree();
                if (e.key.toLowerCase() === 'f') addWood();
                if (e.key.toLowerCase() === 'b') buildWall();
            });

            window.addEventListener('keyup', (e) => {
                game.keys[e.key.toLowerCase()] = false;
            });

            canvas.addEventListener('click', () => {
                if (!game.gameOver) attack();
            });
        }

        function updatePlayer() {
            if (game.gameOver) return;

            const forward = camera.getDirection(BABYLON.Axis.Z);
            const right = camera.getDirection(BABYLON.Axis.X);

            if (game.keys['w']) camera.position.addInPlace(forward.scale(game.player.speed));
            if (game.keys['s']) camera.position.addInPlace(forward.scale(-game.player.speed));
            if (game.keys['d']) camera.position.addInPlace(right.scale(game.player.speed));
            if (game.keys['a']) camera.position.addInPlace(right.scale(-game.player.speed));

            game.player.mesh.position = camera.position.clone();
            game.player.mesh.position.y -= 0.8;

            const maxDist = 120;
            const distFromCenter = BABYLON.Vector3.Distance(camera.position, game.camp.position);
            if (distFromCenter > maxDist) {
                const direction = camera.position.subtract(game.camp.position).normalize();
                camera.position = game.camp.position.add(direction.scale(maxDist));
            }
        }

        function spawnEnemy() {
            if (!game.isNight || game.enemies.length > 3 + Math.floor(game.day / 2)) return;

            const angle = Math.random() * Math.PI * 2;
            const distance = 60;
            const posX = game.camp.position.x + Math.cos(angle) * distance;
            const posZ = game.camp.position.z + Math.sin(angle) * distance;

            const plane = BABYLON.MeshBuilder.CreatePlane("enemy", {width: 3, height: 3}, scene);
            plane.position = new BABYLON.Vector3(posX, 1.5, posZ);
            plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            
            const enemyMat = new BABYLON.StandardMaterial("enemyMat", scene);
            enemyMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            enemyMat.backFaceCulling = false;
            
            try {
                enemyMat.emissiveTexture = new BABYLON.Texture("https://raw.githubusercontent.com/HenBenCNN10/99-nightssssssssssssss/main/e93a6de5-2cee-4f72-ae40-a225b739379e.png", scene);
            } catch (e) {
                enemyMat.diffuse = new BABYLON.Color3(0.7, 0.2, 0.2);
            }
            
            plane.material = enemyMat;
            plane.checkCollisions = true;

            game.enemies.push({
                mesh: plane,
                position: new BABYLON.Vector3(posX, 1.5, posZ),
                health: 20 + game.day * 5,
                maxHealth: 20 + game.day * 5,
                speed: 0.08 + game.day * 0.01,
                damage: 5 + game.day * 1
            });
        }

        function updateEnemies() {
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                
                const distToCamp = BABYLON.Vector3.Distance(enemy.position, game.camp.position);
                if (distToCamp < game.camp.radius) {
                    const direction = enemy.position.subtract(game.camp.position).normalize();
                    enemy.position = game.camp.position.add(direction.scale(game.camp.radius + 2));
                    enemy.mesh.position = enemy.position.clone();
                }

                const direction = camera.position.subtract(enemy.position).normalize();
                enemy.position.addInPlace(direction.scale(enemy.speed));
                enemy.mesh.position = enemy.position.clone();

                const playerDist = BABYLON.Vector3.Distance(enemy.position, camera.position);
                
                if (playerDist < 2.5) {
                    game.player.health -= enemy.damage * 0.016;
                }

                if (enemy.health <= 0) {
                    enemy.mesh.dispose();
                    game.enemies.splice(i, 1);
                    game.resources.wood += 2;
                }
            }
        }

        function updateGame() {
            if (game.gameOver || !game.modelsLoaded) return;

            updatePlayer();
            
            game.spawnCounter++;
            if (game.spawnCounter > 40) {
                spawnEnemy();
                game.spawnCounter = 0;
            }
            
            updateEnemies();

            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                const proj = game.projectiles[i];
                proj.mesh.position.addInPlace(proj.direction.scale(proj.speed));
                proj.life--;

                for (let j = game.enemies.length - 1; j >= 0; j--) {
                    const enemy = game.enemies[j];
                    const dist = BABYLON.Vector3.Distance(proj.mesh.position, enemy.mesh.position);
                    if (dist < 2) {
                        enemy.health -= 10;
                        proj.mesh.dispose();
                        game.projectiles.splice(i, 1);
                        break;
                    }
                }

                if (proj.life <= 0) {
                    proj.mesh.dispose();
                    game.projectiles.splice(i, 1);
                }
            }

            if (game.isNight) {
                game.resources.fireLevel -= 0.05;
                if (game.resources.fireLevel <= 0) {
                    game.player.health -= 0.1;
                }
            }

            game.resources.hunger -= 0.02;
            if (game.resources.hunger < 30) {
                game.player.health -= 0.05;
            }

            game.cycleTime++;
            game.isNight = game.cycleTime >= 600;

            if (game.cycleTime >= game.maxCycleTime) {
                game.day++;
                game.cycleTime = 0;
                game.enemies.forEach(e => e.mesh.dispose());
                game.enemies = [];
                game.resources.fireLevel = game.resources.maxFireLevel;
                game.resources.hunger = Math.min(game.resources.hunger + 30, game.resources.maxHunger);
            }

            const sunLight = scene.getLightByName("sunLight");
            const hemiLight = scene.getLightByName("hemiLight");
            
            if (game.isNight) {
                sunLight.intensity = 0.1;
                hemiLight.intensity = 0.3;
                scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.15);
                game.camp.fireLight.intensity = 1.5;
            } else {
                sunLight.intensity = 0.7;
                hemiLight.intensity = 0.9;
                scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92);
                game.camp.fireLight.intensity = 0.8;
            }

            if (game.player.health <= 0) {
                game.gameOver = true;
                document.getElementById('survivalText').innerText = `You survived ${game.day} days`;
                document.getElementById('gameOverScreen').style.display = 'flex';
            }

            updateUI();
        }

        function attack() {
            const direction = camera.getDirection(BABYLON.Axis.Z);
            const projectile = BABYLON.MeshBuilder.CreateSphere("projectile", {diameter: 0.4, segments: 8}, scene);
            projectile.position = camera.position.add(direction.scale(2));
            
            const projMat = new BABYLON.StandardMaterial("projMat", scene);
            projMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0);
            projMat.diffuse = new BABYLON.Color3(1, 1, 0);
            projectile.material = projMat;

            game.projectiles.push({
                mesh: projectile,
                direction: direction,
                speed: 0.5,
                life: 150
            });
        }

        function interactWithTree() {
            for (let i = game.trees.length - 1; i >= 0; i--) {
                const tree = game.trees[i];
                const dist = BABYLON.Vector3.Distance(camera.position, tree.position);
                
                if (dist < 12) {
                    game.resources.wood += tree.wood;
                    tree.trunk.dispose();
                    tree.foliage.dispose();
                    game.trees.splice(i, 1);
                    break;
                }
            }
        }

        function addWood() {
            if (game.resources.wood >= 5) {
                game.resources.fireLevel = Math.min(game.resources.fireLevel + 10, game.resources.maxFireLevel);
                game.resources.wood -= 5;
            }
        }

        function buildWall() {
            if (game.resources.wood >= 10 && game.camp.walls < game.camp.maxWalls) {
                game.resources.wood -= 10;
                game.camp.walls++;
            }
        }

        function updateUI() {
            document.getElementById('day-display').textContent = `Day ${game.day}`;
            
            let phaseTime = game.isNight ? game.cycleTime - 600 : game.cycleTime;
            const minutes = Math.floor(phaseTime / 60);
            const seconds = Math.floor(phaseTime % 60);
            const phase = game.isNight ? 'Night' : 'Day';
            document.getElementById('time-display').textContent = `${phase} ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            document.getElementById('health-text').textContent = `${Math.floor(game.player.health)}/100`;
            document.getElementById('health-bar').style.width = (game.player.health) + '%';

            document.getElementById('hunger-text').textContent = `${Math.floor(game.resources.hunger)}/100`;
            document.getElementById('hunger-bar').style.width = (game.resources.hunger) + '%';

            document.getElementById('fire-text').textContent = `${Math.floor(game.resources.fireLevel)}/20`;
            document.getElementById('fire-bar').style.width = (game.resources.fireLevel / game.resources.maxFireLevel * 100) + '%';

            document.getElementById('wood-count').textContent = game.resources.wood;
        }

        async function main() {
            await createScene();
            
            for (let i = 0; i < 20; i++) {
                createTree(scene);
            }
            
            engine.runRenderLoop(() => {
                updateGame();
                scene.render();
            });

            window.addEventListener("resize", () => {
                engine.resize();
            });
        }

        main();
    </script>
</body>
</html>
